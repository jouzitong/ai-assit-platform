<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layered List Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: rgba(255, 255, 255, 0.88);
      --panel-strong: #ffffff;
      --line: rgba(15, 23, 42, 0.08);
      --line-strong: rgba(15, 23, 42, 0.14);
      --text: #111827;
      --muted: #6b7280;
      --soft: #eef2ff;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --success: #16a34a;
      --warning: #d97706;
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 16px 36px rgba(15, 23, 42, 0.06);
      --shadow-sm: 0 8px 18px rgba(15, 23, 42, 0.05);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, 0.18), transparent 28%),
        radial-gradient(circle at 85% 18%, rgba(251, 191, 36, 0.12), transparent 22%),
        linear-gradient(180deg, #ffffff 0%, #f6f7fb 48%, #eef2f7 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 28rem;
      height: 28rem;
      border-radius: 999px;
      filter: blur(10px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: -8rem;
      right: -8rem;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 68%);
    }

    body::after {
      left: -10rem;
      bottom: -12rem;
      background: radial-gradient(circle, rgba(191, 219, 254, 0.55) 0%, rgba(191, 219, 254, 0) 70%);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto 48px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.9));
      box-shadow: var(--shadow-lg);
      animation: riseIn 720ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0) 20%, rgba(255, 255, 255, 0.48) 48%, rgba(255, 255, 255, 0) 72%);
      transform: translateX(-110%);
      animation: shimmer 1100ms 220ms ease-out both;
      pointer-events: none;
    }

    .hero-top,
    .toolbar,
    .stats,
    .list {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(37, 99, 235, 0.12);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: var(--shadow-sm);
    }

    .hero-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(32px, 4vw, 56px);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .lead {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .hero-side {
      min-width: 240px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(14px);
    }

    .hero-side p {
      margin: 0 0 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .hero-side strong {
      display: block;
      margin-bottom: 12px;
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .stat-card {
      padding: 18px 20px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.84);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(16px);
      animation: riseIn 700ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .stat-card:nth-child(2) { animation-delay: 70ms; }
    .stat-card:nth-child(3) { animation-delay: 140ms; }
    .stat-card:nth-child(4) { animation-delay: 210ms; }

    .stat-label {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .stat-meta {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .board {
      margin-top: 24px;
      padding: 20px;
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(250, 251, 255, 0.92));
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(18px);
      animation: riseIn 800ms 180ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 8px 6px 20px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }

    .search input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      font: inherit;
      color: var(--text);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .chip {
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease, color 220ms ease;
    }

    .chip.active,
    .chip:hover {
      color: var(--accent);
      border-color: rgba(37, 99, 235, 0.18);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.12);
      transform: translateY(-1px);
    }

    .list {
      display: grid;
      gap: 14px;
    }

    .item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 20px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(249, 250, 251, 0.94));
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: var(--shadow-md);
      transform: translateY(26px) scale(0.985);
      opacity: 0;
      transition: transform 240ms ease, box-shadow 240ms ease, border-color 240ms ease;
    }

    .item.is-visible {
      animation: cardIn 700ms cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: var(--delay, 0ms);
    }

    .item:hover {
      transform: translateY(-3px);
      border-color: rgba(37, 99, 235, 0.14);
      box-shadow: 0 22px 40px rgba(15, 23, 42, 0.08);
    }

    .avatar {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.14), rgba(59, 130, 246, 0.04));
      color: var(--accent);
      font-size: 16px;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .item-main {
      min-width: 0;
    }

    .item-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      min-width: 0;
    }

    .item-title strong {
      font-size: 18px;
      letter-spacing: -0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.live {
      background: rgba(22, 163, 74, 0.1);
      color: var(--success);
    }

    .badge.review {
      background: rgba(217, 119, 6, 0.1);
      color: var(--warning);
    }

    .item-desc {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .pill {
      padding: 8px 10px;
      border-radius: 12px;
      background: var(--soft);
      color: #334155;
      font-size: 12px;
      font-weight: 700;
    }

    .item-side {
      min-width: 180px;
      display: grid;
      gap: 12px;
      justify-items: end;
    }

    .metric {
      text-align: right;
    }

    .metric strong {
      display: block;
      font-size: 24px;
      letter-spacing: -0.04em;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .progress {
      width: 180px;
      height: 10px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .progress i {
      display: block;
      height: 100%;
      width: var(--progress, 50%);
      border-radius: inherit;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      transform-origin: left center;
      transform: scaleX(0.4);
      animation: fillBar 900ms calc(var(--delay, 0ms) + 320ms) cubic-bezier(.2, .8, .2, 1) forwards;
    }

    .footer-note {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
      padding: 8px 6px 0;
      color: var(--muted);
      font-size: 13px;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(28px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmer {
      from { transform: translateX(-110%); }
      to { transform: translateX(120%); }
    }

    @keyframes cardIn {
      0% {
        opacity: 0;
        transform: translateY(26px) scale(0.985);
      }
      70% {
        opacity: 1;
        transform: translateY(-2px) scale(1);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fillBar {
      from { transform: scaleX(0.4); }
      to { transform: scaleX(1); }
    }

    @media (max-width: 980px) {
      .hero-top,
      .toolbar,
      .item {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chips,
      .item-side {
        justify-content: start;
      }

      .metric {
        text-align: left;
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 20px, 1180px);
        margin-top: 10px;
      }

      .hero,
      .board {
        padding: 16px;
        border-radius: 24px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .item {
        padding: 16px;
      }

      .progress {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }

      .item {
        opacity: 1;
        transform: none;
      }

      .progress i {
        transform: scaleX(1);
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow">White Layered List</div>
          <h1>简洁白色列表，也能有层次和呼吸感。</h1>
          <p class="lead">
            这是一版偏专业后台和内容管理风格的列表布局。重点不靠深色和夸张渐变，而是通过玻璃感面板、阴影层级、间距节奏和刷新入场动画，把页面做得更轻、更干净，也更有品质。
          </p>
        </div>
        <aside class="hero-side">
          <p>本次视图</p>
          <strong>24 Items</strong>
          <p>带筛选、摘要、进度与卡片化列表结构</p>
        </aside>
      </div>

      <div class="stats">
        <article class="stat-card">
          <div class="stat-label">总任务量</div>
          <div class="stat-value">128</div>
          <div class="stat-meta">较昨日 +12.4%</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">处理中</div>
          <div class="stat-value">32</div>
          <div class="stat-meta">队列稳定，响应正常</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">已完成</div>
          <div class="stat-value">74</div>
          <div class="stat-meta">自动归档开启</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">风险项</div>
          <div class="stat-value">06</div>
          <div class="stat-meta">建议优先复核</div>
        </article>
      </div>
    </section>

    <section class="board">
      <div class="toolbar">
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M21 21L16.65 16.65M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input type="text" placeholder="搜索项目、负责人、状态">
        </label>
        <div class="chips">
          <button class="chip active">全部</button>
          <button class="chip">进行中</button>
          <button class="chip">待复核</button>
          <button class="chip">高优先级</button>
        </div>
      </div>

      <div class="list" id="list"></div>

      <div class="footer-note">
        <span>页面采用一次性入场动效，避免持续动画造成干扰。</span>
        <span>白色主题通过明暗面板和阴影深浅建立纵深。</span>
      </div>
    </section>
  </main>

  <script>
    const items = [
      { name: "知识库配置中心", tag: "Live", desc: "统一维护知识源、同步策略和可见范围，适合作为平台入口型列表项展示。", owner: "Ava", type: "AI Engine", level: "公开", score: "92%", progress: "92%" },
      { name: "模型调用审计", tag: "Review", desc: "汇总调用链路、失败原因和成本波动，强调数据密度和可扫描性。", owner: "Liam", type: "Gateway", level: "内部", score: "68%", progress: "68%" },
      { name: "工作流执行记录", tag: "Live", desc: "按轮次展示任务推进状态，适合搭配轻量色块和进度条表现完成度。", owner: "Nora", type: "Workflow", level: "公开", score: "84%", progress: "84%" },
      { name: "Prompt 模板市场", tag: "Live", desc: "支持标签化浏览、版本追踪和快速预览，用层叠卡片做出精致但不厚重的白色界面。", owner: "Milo", type: "Template", level: "共享", score: "77%", progress: "77%" },
      { name: "数据权限申请单", tag: "Review", desc: "这类偏流程的列表更需要结构清晰，减少视觉噪音，保留明确的审核焦点。", owner: "Iris", type: "Security", level: "审批中", score: "51%", progress: "51%" },
      { name: "资源发布看板", tag: "Live", desc: "顶部摘要区与列表区形成前后层级，刷新时卡片依次浮现，页面会更有呼吸感。", owner: "Owen", type: "Release", level: "公开", score: "96%", progress: "96%" }
    ];

    const list = document.getElementById("list");

    list.innerHTML = items.map((item, index) => `
      <article class="item" style="--delay:${index * 90}ms">
        <div class="avatar">${item.owner.slice(0, 1)}</div>
        <div class="item-main">
          <div class="item-title">
            <strong>${item.name}</strong>
            <span class="badge ${item.tag === "Live" ? "live" : "review"}">${item.tag === "Live" ? "运行中" : "待复核"}</span>
          </div>
          <p class="item-desc">${item.desc}</p>
          <div class="item-meta">
            <span class="pill">Owner · ${item.owner}</span>
            <span class="pill">${item.type}</span>
            <span class="pill">${item.level}</span>
          </div>
        </div>
        <div class="item-side">
          <div class="metric">
            <strong>${item.score}</strong>
            <span>完成度</span>
          </div>
          <div class="progress" aria-label="progress">
            <i style="--progress:${item.progress}"></i>
          </div>
        </div>
      </article>
    `).join("");

    requestAnimationFrame(() => {
      document.querySelectorAll(".item").forEach((node) => node.classList.add("is-visible"));
    });
  </script>
</body>
</html>
