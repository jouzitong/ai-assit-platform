<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Web Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --sidebar-width: 288px;
            --sidebar-collapsed-width: 76px;

            --bg-main: #ffffff;
            --bg-sidebar: #f7f7f8;
            --bg-hover: #eeeeef;
            --bg-active: #e9e9eb;
            --bg-input: #ffffff;
            --bg-user: #f4f4f5;

            --text-main: #202123;
            --text-muted: #6b7280;
            --border: #e5e7eb;

            --primary: #10a37f;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body.dark {
            --bg-main: #212121;
            --bg-sidebar: #171717;
            --bg-hover: #2f2f2f;
            --bg-active: #343434;
            --bg-input: #2f2f2f;
            --bg-user: #303030;

            --text-main: #ececec;
            --text-muted: #a1a1aa;
            --border: #333333;

            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            color: var(--text-main);
            background: var(--bg-main);
        }

        button,
        textarea {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100vw;
            height: 100vh;
            display: flex;
            background: var(--bg-main);
        }

        /* =========================
           左侧栏
        ========================= */

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 12px;
            transition: width 0.22s ease, transform 0.22s ease;
            overflow: hidden;
            z-index: 30;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
            padding-left: 10px;
            padding-right: 10px;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            min-height: 42px;
        }

        .brand {
            flex: 1;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 650;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-desc {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
        }

        .collapse-btn {
            transition: transform 0.22s ease;
        }

        .sidebar.collapsed .collapse-btn {
            transform: rotate(180deg);
        }

        .new-chat {
            width: 100%;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .new-chat:hover {
            background: var(--bg-hover);
        }

        .btn-icon {
            width: 22px;
            flex-shrink: 0;
            text-align: center;
            font-size: 16px;
        }

        .btn-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .side-tools {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .side-tool {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            font-size: 14px;
            text-align: left;
        }

        .side-tool:hover {
            background: var(--bg-hover);
        }

        .side-tool.active {
            background: var(--bg-active);
        }

        .tool-icon {
            width: 22px;
            flex-shrink: 0;
            text-align: center;
            font-size: 16px;
        }

        .tool-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-group {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .history-title {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 8px 8px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .history-title:hover {
            color: var(--text-main);
        }

        .history-title-text {
            min-width: 0;
        }

        .history-title-arrow {
            font-size: 12px;
            transition: transform 0.2s ease;
        }

        .chat-group.collapsed .history-title-arrow {
            transform: rotate(-90deg);
        }

        .chat-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 2px;
        }

        .chat-group.collapsed .chat-list {
            display: none;
        }

        .chat-item {
            width: 100%;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .chat-item:hover {
            background: var(--bg-hover);
        }

        .chat-item.active {
            background: var(--bg-active);
        }

        .chat-icon {
            width: 22px;
            flex-shrink: 0;
            text-align: center;
            font-size: 15px;
        }

        .chat-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #dbeafe;
            color: #1d4ed8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-plan {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 侧边栏最小化时 */
        .sidebar.collapsed .brand-text,
        .sidebar.collapsed .btn-text,
        .sidebar.collapsed .tool-text,
        .sidebar.collapsed .chat-title,
        .sidebar.collapsed .user-info {
            display: none;
        }

        .sidebar.collapsed .chat-group {
            display: none;
        }

        .sidebar.collapsed .sidebar-top {
            justify-content: center;
            flex-direction: column;
            height: auto;
        }

        .sidebar.collapsed .brand {
            justify-content: center;
            flex: none;
            width: 100%;
        }

        .sidebar.collapsed .new-chat,
        .sidebar.collapsed .side-tool,
        .sidebar.collapsed .chat-item {
            justify-content: center;
            padding: 0;
        }

        .sidebar.collapsed .sidebar-footer {
            justify-content: center;
            margin-top: auto;
        }

        /* =========================
           主聊天区域
        ========================= */

        .main {
            flex: 1;
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .topbar {
            height: 58px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: var(--bg-main);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .menu-btn {
            display: none;
        }

        .model-title {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .model-name {
            font-size: 15px;
            font-weight: 650;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .model-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .small-btn {
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            padding: 0 12px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .small-btn:hover {
            background: var(--bg-hover);
        }

        .chat-stage {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .chat-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 32px 18px 28px;
        }

        .welcome {
            max-width: 780px;
            margin: 70px auto 28px;
            text-align: center;
        }

        .welcome h1 {
            font-size: 32px;
            line-height: 1.25;
            margin: 0 0 12px;
            font-weight: 700;
        }

        .welcome p {
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
        }

        .suggestions {
            max-width: 780px;
            margin: 24px auto 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .suggestion-card {
            min-height: 80px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: transparent;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            padding: 14px 16px;
        }

        .suggestion-card:hover {
            background: var(--bg-hover);
        }

        .suggestion-card strong {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .suggestion-card span {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .message-list {
            max-width: 860px;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 26px;
            line-height: 1.75;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 700;
            margin-top: 3px;
        }

        .message-avatar.ai {
            background: var(--primary);
            color: #fff;
        }

        .message-avatar.user {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .message-body {
            flex: 1;
            min-width: 0;
        }

        .message-name {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .message-text {
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ai-response {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .ai-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 4px;
            flex-wrap: wrap;
        }

        .ai-action-btn {
            height: 30px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 12px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .ai-action-btn:hover {
            background: var(--bg-hover);
            color: var(--text-main);
        }

        .ai-section {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: color-mix(in srgb, var(--bg-main) 92%, var(--primary) 8%);
            padding: 14px 16px;
        }

        .ai-summary {
            border: none;
            background: transparent;
            padding: 0 0 6px;
        }

        .ai-summary .ai-section-title {
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 0;
            font-weight: 700;
        }

        .ai-summary .ai-section-body {
            color: var(--text-main);
        }

        .ai-section-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .ai-section-body {
            font-size: 14px;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ai-thoughts {
            border: none;
            background: transparent;
            padding: 0 0 4px;
        }

        .ai-thoughts summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            padding: 0;
        }

        .ai-thoughts summary::-webkit-details-marker {
            display: none;
        }

        .ai-thoughts summary::after {
            content: "⌄";
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
            margin-left: auto;
            flex-shrink: 0;
        }

        .ai-thoughts[open] summary::after {
            transform: rotate(180deg);
        }

        .ai-thoughts-head {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .ai-thoughts .ai-section-title {
            margin-bottom: 0;
            color: var(--text-muted);
            font-size: 13px;
            letter-spacing: 0;
        }

        .ai-processing-time {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .ai-thoughts-body {
            margin-top: 8px;
            padding-left: 2px;
            font-size: 14px;
            line-height: 1.75;
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ai-progress {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ai-progress-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .ai-progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 8px;
            flex-shrink: 0;
            background: #d1d5db;
        }

        .ai-progress-dot.done {
            background: #10b981;
        }

        .ai-progress-dot.running {
            background: #f59e0b;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.16);
        }

        .ai-progress-content {
            flex: 1;
            min-width: 0;
        }

        .ai-progress-label {
            font-size: 14px;
            font-weight: 600;
        }

        .ai-progress-desc {
            margin-top: 2px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .ai-result {
            border-radius: 18px;
            border: 1px solid color-mix(in srgb, var(--border) 82%, var(--primary) 18%);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02)),
                linear-gradient(90deg, rgba(16, 163, 127, 0.04) 1px, transparent 1px),
                linear-gradient(rgba(16, 163, 127, 0.04) 1px, transparent 1px),
                color-mix(in srgb, var(--bg-main) 95%, var(--primary) 5%);
            background-size: auto, 24px 24px, 24px 24px, auto;
            background-position: 0 0, 0 0, 0 0, 0 0;
            padding: 16px;
        }

        .result-canvas-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .result-canvas-title {
            font-size: 13px;
            font-weight: 700;
        }

        .result-canvas-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .result-canvas-btn {
            height: 30px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.82);
            color: var(--text-muted);
            cursor: pointer;
            padding: 0 12px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .result-canvas-btn:hover {
            background: var(--bg-main);
            color: var(--text-main);
        }

        .result-canvas-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 12px;
        }

        .ai-result.is-fullscreen {
            position: fixed;
            inset: 24px;
            z-index: 80;
            overflow: auto;
            padding: 20px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.24);
        }

        body.canvas-fullscreen {
            overflow: hidden;
        }

        .canvas-backdrop {
            position: fixed;
            inset: 0;
            z-index: 70;
            background: rgba(15, 23, 42, 0.38);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .canvas-backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }

        .ai-result-card {
            border-radius: 14px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            padding: 14px;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.04);
        }

        .ai-result-card strong {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .ai-result-card.canvas-list {
            grid-column: span 12;
        }

        .ai-result-card.canvas-bar,
        .ai-result-card.canvas-pie {
            grid-column: span 6;
        }

        .result-list {
            display: grid;
            gap: 10px;
        }

        .result-list-row {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr 0.8fr;
            gap: 12px;
            align-items: center;
            padding: 10px 12px;
            border-radius: 12px;
            background: color-mix(in srgb, var(--bg-main) 94%, var(--primary) 6%);
            font-size: 13px;
        }

        .result-list-row.header {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            background: transparent;
            padding: 0 2px 4px;
        }

        .result-list-row span:last-child,
        .result-list-row span:nth-child(2) {
            text-align: right;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            min-height: 180px;
            padding-top: 14px;
        }

        .bar-item {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .bar-value {
            font-size: 12px;
            color: var(--text-muted);
        }

        .bar-track {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bar-fill {
            width: 100%;
            max-width: 52px;
            border-radius: 12px 12px 6px 6px;
            background: linear-gradient(180deg, #34d399 0%, #10a37f 100%);
            box-shadow: inset 0 -8px 0 rgba(255, 255, 255, 0.12);
        }

        .bar-label {
            font-size: 12px;
            text-align: center;
            color: var(--text-main);
        }

        .pie-wrap {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .pie-chart {
            width: 156px;
            height: 156px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 10px solid rgba(255, 255, 255, 0.5);
        }

        .pie-legend {
            display: grid;
            gap: 10px;
            flex: 1;
            min-width: 220px;
        }

        .pie-legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
        }

        .pie-legend-main {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .pie-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .pie-legend-value {
            color: var(--text-muted);
            white-space: nowrap;
        }

        .progress-dock-inner {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: color-mix(in srgb, var(--bg-main) 90%, var(--primary) 10%);
            padding: 10px 14px;
            margin: 0 auto;
            width: 75%;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .progress-dock {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(100% - 16px);
            z-index: 3;
            pointer-events: none;
        }

        .progress-dock[hidden] {
            display: none;
        }

        .progress-dock > * {
            pointer-events: auto;
        }

        .progress-dock-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .progress-dock-header::-webkit-details-marker {
            display: none;
        }

        .progress-dock-header::marker {
            content: "";
        }

        .progress-dock-toggle {
            flex-shrink: 0;
            font-size: 12px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .progress-dock-inner[open] .progress-dock-toggle {
            transform: rotate(180deg);
        }

        .progress-dock .ai-section-title {
            margin-bottom: 0;
        }

        .progress-dock-body {
            margin-top: 8px;
        }

        .progress-dock .ai-progress {
            gap: 6px;
        }

        .progress-dock .ai-progress-item {
            align-items: center;
            gap: 8px;
            min-height: 24px;
        }

        .progress-dock .ai-progress-dot {
            width: 8px;
            height: 8px;
            margin-top: 0;
        }

        .progress-dock .ai-progress-dot.running {
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
        }

        .progress-dock .ai-progress-content {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .progress-dock .ai-progress-label {
            flex-shrink: 0;
            font-size: 13px;
        }

        .progress-dock .ai-progress-desc {
            margin-top: 0;
            font-size: 12px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .message.user-message {
            justify-content: flex-end;
        }

        .message.user-message .message-avatar,
        .message.user-message .message-name {
            display: none;
        }

        .message.user-message .message-body {
            flex: none;
            max-width: 76%;
            background: var(--bg-user);
            border-radius: 18px;
            padding: 11px 15px;
        }

        /* =========================
           底部输入框
        ========================= */

        .composer-area {
            flex-shrink: 0;
            padding: 14px 18px 20px;
            background: var(--bg-main);
        }

        .composer {
            max-width: 860px;
            margin: 0 auto;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-input);
            box-shadow: var(--shadow);
            padding: 10px;
            position: relative;
        }

        .composer textarea {
            width: 100%;
            min-height: 46px;
            max-height: 160px;
            resize: none;
            outline: none;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 15px;
            line-height: 1.6;
            padding: 8px 10px;
            display: block;
        }

        .composer-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 4px;
        }

        .composer-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .composer-hint {
            flex: 1;
            min-width: 0;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .main.is-empty .chat-stage {
            justify-content: center;
            padding: 24px 0 40px;
        }

        .main.is-empty .chat-scroll {
            flex: 0 0 auto;
            min-height: auto;
            overflow: visible;
            padding: 0 18px 24px;
        }

        .main.is-empty .welcome {
            margin: 0 auto 20px;
        }

        .main.is-empty .composer-area {
            padding-top: 0;
            padding-bottom: 0;
        }

        .main.is-empty .suggestions {
            margin: 20px auto 0;
        }

        /* =========================
           移动端
        ========================= */

        .overlay {
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: var(--sidebar-width);
                transform: translateX(-100%);
                box-shadow: var(--shadow);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar.collapsed {
                width: var(--sidebar-width);
                padding: 12px;
            }

            .sidebar.collapsed .brand-text,
            .sidebar.collapsed .btn-text,
            .sidebar.collapsed .tool-text,
            .sidebar.collapsed .chat-title,
            .sidebar.collapsed .history-title,
            .sidebar.collapsed .user-info {
                display: block;
            }

            .sidebar.collapsed .sidebar-top {
                flex-direction: row;
                justify-content: flex-start;
            }

            .sidebar.collapsed .brand {
                justify-content: flex-start;
                flex: 1;
            }

            .sidebar.collapsed .new-chat,
            .sidebar.collapsed .side-tool,
            .sidebar.collapsed .chat-item {
                justify-content: flex-start;
                padding: 0 10px;
            }

            .collapse-btn {
                display: none;
            }

            .menu-btn {
                display: inline-flex;
            }

            .overlay.show {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.35);
                z-index: 20;
            }

            .topbar {
                padding: 0 12px;
            }

            .topbar-actions .small-btn {
                display: none;
            }

            .chat-scroll {
                padding: 24px 14px 20px;
            }

            .welcome {
                margin-top: 40px;
            }

            .welcome h1 {
                font-size: 26px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .message.user-message .message-body {
                max-width: 88%;
            }

            .composer-area {
                padding: 12px 12px 16px;
            }

            .composer-tools .small-btn:nth-child(2) {
                display: none;
            }

            .composer-bottom {
                align-items: flex-end;
            }

            .composer-hint {
                font-size: 11px;
                text-align: left;
            }

            .progress-dock .ai-progress-content {
                gap: 6px;
            }

            .progress-dock-inner {
                width: 92%;
            }

            .progress-dock {
                bottom: calc(100% - 12px);
            }

            .result-canvas-grid {
                grid-template-columns: 1fr;
            }

            .ai-result-card.canvas-list,
            .ai-result-card.canvas-bar,
            .ai-result-card.canvas-pie {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>
<div class="app">
    <!-- 左侧栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand" title="AI Chat">
                <div class="brand-logo">AI</div>
                <div class="brand-text">
                    <div class="brand-name">AI Chat</div>
                    <div class="brand-desc">智能助手工作台</div>
                </div>
            </div>

            <button class="icon-btn collapse-btn" id="collapseBtn" title="最小化侧边栏">
                ⇤
            </button>
        </div>

        <button class="new-chat" id="newChatBtn" title="新建聊天">
            <span class="btn-icon">＋</span>
            <span class="btn-text">新建聊天</span>
        </button>

        <div class="side-tools">
            <button class="side-tool active" title="聊天">
                <span class="tool-icon">📚</span>
                <span class="tool-text">知识库</span>
            </button>

            <button class="side-tool" title="搜索">
                <span class="tool-icon">🔍</span>
                <span class="tool-text">搜索</span>
            </button>

            <button class="side-tool" title="我的应用">
                <span class="tool-icon">🧩</span>
                <span class="tool-text">我的应用</span>
            </button>
        </div>

        <div class="chat-group" id="chatGroup">
            <button class="history-title" id="chatGroupToggle" type="button" title="收起聊天列表">
                <span class="history-title-text">聊天</span>
                <span class="history-title-arrow">⌄</span>
            </button>

            <div class="chat-list">
                <div class="chat-item active" title="智能问数平台设计">
                    <span class="chat-icon">📄</span>
                    <span class="chat-title">智能问数平台设计</span>
                </div>

                <div class="chat-item" title="低代码 JSON 渲染方案">
                    <span class="chat-icon">📄</span>
                    <span class="chat-title">低代码 JSON 渲染方案</span>
                </div>

                <div class="chat-item" title="数据权限设计">
                    <span class="chat-icon">📄</span>
                    <span class="chat-title">数据权限设计</span>
                </div>

                <div class="chat-item" title="AI Agent 节点编排">
                    <span class="chat-icon">📄</span>
                    <span class="chat-title">AI Agent 节点编排</span>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="user-avatar">周</div>
            <div class="user-info">
                <div class="user-name">周志通</div>
                <div class="user-plan">个人工作区</div>
            </div>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- 主区域 -->
    <main class="main is-empty" id="mainContent">
        <header class="topbar">
            <div class="topbar-left">
                <button class="icon-btn menu-btn" id="menuBtn" title="打开侧边栏">
                    ☰
                </button>

                <div class="model-title">
                    <div class="model-name">AI 助手</div>
                    <div class="model-subtitle">聊天页面完整示例</div>
                </div>
            </div>

            <div class="topbar-actions">
                <button class="small-btn" id="themeBtn">☾ 主题</button>
                <button class="small-btn">分享</button>
                <button class="small-btn">设置</button>
            </div>
        </header>

        <div class="chat-stage">
            <section class="chat-scroll" id="chatScroll">
                <div id="welcomeArea">
                    <div class="welcome">
                        <h1>今天想聊点什么？</h1>
                        <p>这是一个仿 ChatGPT Web 风格的聊天页面。</p>
                    </div>
                </div>

                <div class="message-list" id="messageList"></div>
            </section>

            <footer class="composer-area">
                <div class="composer">
                    <section class="progress-dock" id="progressDock" hidden>
                        <details class="progress-dock-inner" id="progressDockInner" open></details>
                    </section>

              <textarea
                      id="messageInput"
                      placeholder="给 AI 助手发送消息..."
                      rows="1"
              ></textarea>

                    <div class="composer-bottom">
                        <div class="composer-tools">
                            <button class="small-btn">＋ 附件</button>
                            <button class="small-btn">工具</button>
                        </div>

                        <div class="composer-hint">Enter 发送，Shift + Enter 换行</div>

                        <button class="send-btn" id="sendBtn" disabled title="发送">
                            ↑
                        </button>
                    </div>
                </div>
            </footer>

            <div class="suggestions" id="suggestionsArea">
                <button class="suggestion-card">
                    <strong>生成 SQL 查询方案</strong>
                    <span>根据自然语言拆解查询主体、条件和展示字段。</span>
                </button>

                <button class="suggestion-card">
                    <strong>设计低代码页面</strong>
                    <span>用 JSON 描述列表、详情、表单、看板页面。</span>
                </button>

                <button class="suggestion-card">
                    <strong>优化系统架构</strong>
                    <span>梳理服务拆分、节点流程、工具调用边界。</span>
                </button>

                <button class="suggestion-card">
                    <strong>写一个前端页面</strong>
                    <span>生成一个可以直接运行的 HTML 页面。</span>
                </button>
            </div>
        </div>
    </main>
</div>
<div class="canvas-backdrop" id="canvasBackdrop"></div>

<script>
    const mainContent = document.getElementById("mainContent");
    const sidebar = document.getElementById("sidebar");
    const collapseBtn = document.getElementById("collapseBtn");
    const menuBtn = document.getElementById("menuBtn");
    const overlay = document.getElementById("overlay");
    const themeBtn = document.getElementById("themeBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const chatGroup = document.getElementById("chatGroup");
    const chatGroupToggle = document.getElementById("chatGroupToggle");

    const chatScroll = document.getElementById("chatScroll");
    const welcomeArea = document.getElementById("welcomeArea");
    const messageList = document.getElementById("messageList");
    const suggestionsArea = document.getElementById("suggestionsArea");
    const progressDock = document.getElementById("progressDock");
    const progressDockInner = document.getElementById("progressDockInner");
    const canvasBackdrop = document.getElementById("canvasBackdrop");

    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    function buildMockReply(question) {
        return {
            processingTime: "1.8s",
            summary: `你想让 AI 回答区从单一摘要，升级为完整的四段式消息展示：保留“问题总结”，并补上可折叠的思考过程、执行进度，以及问数最终结果渲染。`,
            thoughts: [
                `先识别用户问题的核心目标，提炼成简短摘要，避免回答一上来就铺陈细节。`,
                `把推理过程放进可折叠区域，默认收起，既保留可解释性，也不干扰主阅读流。`,
                `将执行过程拆成阶段化进度，让用户看到“理解问题、生成 SQL、执行查询、整理结果”的状态变化。`,
                `最终结果单独渲染成结果卡片，适合后续替换成真实图表、表格或指标区块。`,
                `当前演示消息基于你的输入“${question}”生成，后续可直接替换为接口返回的结构化 JSON。`
            ],
            progress: [
                {
                    status: "done",
                    label: "理解用户问题",
                    description: "已完成问题归纳。"
                },
                {
                    status: "done",
                    label: "组织思考过程",
                    description: "已生成可折叠思考内容。"
                },
                {
                    status: "running",
                    label: "渲染结果区块",
                    description: "正在组装结果卡片。"
                }
            ],
            result: [
                {
                    type: "list",
                    title: "列表",
                    columns: ["渠道", "成交额", "占比"],
                    rows: [
                        ["现货交易", "1,280 万", "42%"],
                        ["合约交易", "1,040 万", "34%"],
                        ["策略跟单", "720 万", "24%"]
                    ]
                },
                {
                    type: "bar",
                    title: "柱状图",
                    unit: "万",
                    items: [
                        { label: "周一", value: 82 },
                        { label: "周二", value: 116 },
                        { label: "周三", value: 96 },
                        { label: "周四", value: 138 },
                        { label: "周五", value: 124 }
                    ]
                },
                {
                    type: "pie",
                    title: "饼图",
                    items: [
                        { label: "新客", value: 46, color: "#10a37f" },
                        { label: "老客复购", value: 34, color: "#34d399" },
                        { label: "活动转化", value: 20, color: "#f59e0b" }
                    ]
                }
            ]
        };
    }

    function isMobile() {
        return window.innerWidth <= 768;
    }

    function closeMobileSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
    }

    collapseBtn.addEventListener("click", () => {
        if (isMobile()) return;

        sidebar.classList.toggle("collapsed");

        const collapsed = sidebar.classList.contains("collapsed");
        collapseBtn.title = collapsed ? "展开侧边栏" : "最小化侧边栏";
    });

    menuBtn.addEventListener("click", () => {
        sidebar.classList.add("open");
        overlay.classList.add("show");
    });

    overlay.addEventListener("click", closeMobileSidebar);

    themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        const isDark = document.body.classList.contains("dark");
        themeBtn.textContent = isDark ? "☀ 主题" : "☾ 主题";
    });

    chatGroupToggle.addEventListener("click", () => {
        chatGroup.classList.toggle("collapsed");
        const collapsed = chatGroup.classList.contains("collapsed");
        chatGroupToggle.title = collapsed ? "展开聊天列表" : "收起聊天列表";
    });

    newChatBtn.addEventListener("click", () => {
        messageList.innerHTML = "";
        messageInput.value = "";
        sendBtn.disabled = true;
        autoResizeTextarea();
        syncEmptyState();

        if (isMobile()) {
            closeMobileSidebar();
        }
    });

    document.querySelectorAll(".suggestion-card").forEach((card) => {
        card.addEventListener("click", () => {
            const title = card.querySelector("strong").innerText;
            messageInput.value = title;
            sendBtn.disabled = false;
            autoResizeTextarea();
            messageInput.focus();
        });
    });

    messageInput.addEventListener("input", () => {
        sendBtn.disabled = messageInput.value.trim() === "";
        autoResizeTextarea();
    });

    messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener("click", sendMessage);

    function autoResizeTextarea() {
        messageInput.style.height = "auto";
        messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + "px";
    }

    function syncEmptyState() {
        const isEmpty = messageList.children.length === 0;
        mainContent.classList.toggle("is-empty", isEmpty);
        welcomeArea.style.display = isEmpty ? "block" : "none";
        suggestionsArea.style.display = isEmpty ? "grid" : "none";
        if (isEmpty) {
            progressDock.hidden = true;
            progressDockInner.innerHTML = "";
        }
    }

    function appendMessage(role, payload) {
        const message = document.createElement("div");
        message.className = role === "user" ? "message user-message" : "message";

        const avatar = document.createElement("div");
        avatar.className =
            role === "user" ? "message-avatar user" : "message-avatar ai";
        avatar.textContent = role === "user" ? "你" : "AI";

        const body = document.createElement("div");
        body.className = "message-body";

        const name = document.createElement("div");
        name.className = "message-name";
        name.textContent = role === "user" ? "你" : "";

        const content = document.createElement("div");

        if (role === "user") {
            content.className = "message-text";
            content.textContent = payload;
        } else {
            content.className = "ai-response";
            renderAiResponse(content, payload);
        }

        body.appendChild(name);
        body.appendChild(content);

        message.appendChild(avatar);
        message.appendChild(body);

        messageList.appendChild(message);

        chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function createSectionTitle(text) {
        const title = document.createElement("div");
        title.className = "ai-section-title";
        title.textContent = text;
        return title;
    }

    function createSectionBody(text) {
        const body = document.createElement("div");
        body.className = "ai-section-body";
        body.textContent = text;
        return body;
    }

    function getCanvasSnapshotMarkup(canvas) {
        const styles = Array.from(document.querySelectorAll("style"))
            .map((style) => style.textContent)
            .join("\n");
        return `
            <!DOCTYPE html>
            <html lang="zh-CN">
            <head>
                <meta charset="UTF-8" />
                <title>结果画布导出</title>
                <style>${styles}</style>
                <style>
                    body {
                        margin: 0;
                        padding: 24px;
                        background: #f3f4f6;
                    }
                    .export-wrap {
                        max-width: 1400px;
                        margin: 0 auto;
                    }
                </style>
            </head>
            <body>
                <div class="export-wrap">${canvas.outerHTML}</div>
            </body>
            </html>
        `;
    }

    function toggleCanvasFullscreen(canvas, button) {
        const isFullscreen = canvas.classList.toggle("is-fullscreen");
        document.body.classList.toggle("canvas-fullscreen", isFullscreen);
        canvasBackdrop.classList.toggle("show", isFullscreen);
        button.textContent = isFullscreen ? "退出全屏" : "全屏展示";
    }

    function exportCanvasAsImage(canvas) {
        const rect = canvas.getBoundingClientRect();
        const styles = Array.from(document.querySelectorAll("style"))
            .map((style) => style.textContent)
            .join("\n");
        const markup = `
            <svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(rect.width)}" height="${Math.ceil(rect.height)}">
                <foreignObject width="100%" height="100%">
                    <div xmlns="http://www.w3.org/1999/xhtml">
                        <style>${styles}</style>
                        ${canvas.outerHTML}
                    </div>
                </foreignObject>
            </svg>
        `;
        const blob = new Blob([markup], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
            const exportCanvas = document.createElement("canvas");
            exportCanvas.width = Math.ceil(rect.width) * 2;
            exportCanvas.height = Math.ceil(rect.height) * 2;
            const ctx = exportCanvas.getContext("2d");
            ctx.scale(2, 2);
            ctx.fillStyle = "#f3f4f6";
            ctx.fillRect(0, 0, rect.width, rect.height);
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
            const link = document.createElement("a");
            link.download = "result-canvas.png";
            link.href = exportCanvas.toDataURL("image/png");
            link.click();
        };
        img.src = url;
    }

    function exportCanvasAsPdf(canvas) {
        const exportWindow = window.open("", "_blank", "noopener,noreferrer,width=1280,height=900");
        if (!exportWindow) return;
        exportWindow.document.write(getCanvasSnapshotMarkup(canvas));
        exportWindow.document.close();
        exportWindow.focus();
        setTimeout(() => exportWindow.print(), 250);
    }

    function createResultCard(title, type) {
        const card = document.createElement("div");
        card.className = "ai-result-card";
        if (type) {
            card.classList.add(`canvas-${type}`);
        }

        const heading = document.createElement("strong");
        heading.textContent = title || "";
        card.appendChild(heading);

        return card;
    }

    function renderResultList(card, item) {
        const list = document.createElement("div");
        list.className = "result-list";

        const header = document.createElement("div");
        header.className = "result-list-row header";
        (item.columns || []).forEach((column) => {
            const span = document.createElement("span");
            span.textContent = column;
            header.appendChild(span);
        });
        list.appendChild(header);

        (item.rows || []).forEach((row) => {
            const rowEl = document.createElement("div");
            rowEl.className = "result-list-row";
            row.forEach((value) => {
                const span = document.createElement("span");
                span.textContent = value;
                rowEl.appendChild(span);
            });
            list.appendChild(rowEl);
        });

        card.appendChild(list);
    }

    function renderBarChart(card, item) {
        const values = (item.items || []).map((entry) => entry.value || 0);
        const max = Math.max(...values, 1);
        const chart = document.createElement("div");
        chart.className = "bar-chart";

        (item.items || []).forEach((entry) => {
            const barItem = document.createElement("div");
            barItem.className = "bar-item";

            const value = document.createElement("div");
            value.className = "bar-value";
            value.textContent = `${entry.value}${item.unit || ""}`;

            const track = document.createElement("div");
            track.className = "bar-track";

            const fill = document.createElement("div");
            fill.className = "bar-fill";
            fill.style.height = `${Math.max((entry.value / max) * 100, 12)}%`;

            const label = document.createElement("div");
            label.className = "bar-label";
            label.textContent = entry.label || "";

            track.appendChild(fill);
            barItem.appendChild(value);
            barItem.appendChild(track);
            barItem.appendChild(label);
            chart.appendChild(barItem);
        });

        card.appendChild(chart);
    }

    function renderPieChart(card, item) {
        const entries = item.items || [];
        const total = entries.reduce((sum, entry) => sum + (entry.value || 0), 0) || 1;
        let cursor = 0;
        const segments = entries.map((entry) => {
            const portion = ((entry.value || 0) / total) * 100;
            const segment = `${entry.color} ${cursor}% ${cursor + portion}%`;
            cursor += portion;
            return segment;
        });

        const wrap = document.createElement("div");
        wrap.className = "pie-wrap";

        const pie = document.createElement("div");
        pie.className = "pie-chart";
        pie.style.background = `conic-gradient(${segments.join(", ")})`;

        const legend = document.createElement("div");
        legend.className = "pie-legend";

        entries.forEach((entry) => {
            const legendItem = document.createElement("div");
            legendItem.className = "pie-legend-item";

            const main = document.createElement("div");
            main.className = "pie-legend-main";

            const dot = document.createElement("span");
            dot.className = "pie-dot";
            dot.style.background = entry.color;

            const label = document.createElement("span");
            label.textContent = entry.label || "";

            const value = document.createElement("span");
            value.className = "pie-legend-value";
            value.textContent = `${entry.value}%`;

            main.appendChild(dot);
            main.appendChild(label);
            legendItem.appendChild(main);
            legendItem.appendChild(value);
            legend.appendChild(legendItem);
        });

        wrap.appendChild(pie);
        wrap.appendChild(legend);
        card.appendChild(wrap);
    }

    function renderAiResponse(container, payload) {
        const thoughtSection = document.createElement("details");
        thoughtSection.className = "ai-section ai-thoughts";
        const thoughtSummary = document.createElement("summary");
        const thoughtHead = document.createElement("div");
        thoughtHead.className = "ai-thoughts-head";
        thoughtHead.appendChild(createSectionTitle("AI 思考过程"));

        const processingTime = document.createElement("span");
        processingTime.className = "ai-processing-time";
        processingTime.textContent = `处理时间 ${payload.processingTime || "--"}`;

        thoughtHead.appendChild(processingTime);
        thoughtSummary.appendChild(thoughtHead);
        thoughtSection.appendChild(thoughtSummary);

        const thoughtBody = document.createElement("div");
        thoughtBody.className = "ai-thoughts-body";
        thoughtBody.textContent = (payload.thoughts || []).join("\n\n");
        thoughtSection.appendChild(thoughtBody);
        container.appendChild(thoughtSection);

        const summarySection = document.createElement("section");
        summarySection.className = "ai-section ai-summary";
        summarySection.appendChild(createSectionTitle("对用户提问的总结"));
        summarySection.appendChild(createSectionBody(payload.summary || ""));
        container.appendChild(summarySection);

        const resultSection = document.createElement("section");
        resultSection.className = "ai-section";
        resultSection.appendChild(createSectionTitle("问数最终结果"));
        const resultGrid = document.createElement("div");
        resultGrid.className = "ai-result";

        const canvasHeader = document.createElement("div");
        canvasHeader.className = "result-canvas-header";

        const canvasTitle = document.createElement("div");
        canvasTitle.className = "result-canvas-title";
        canvasTitle.textContent = "结果画布";

        const canvasActions = document.createElement("div");
        canvasActions.className = "result-canvas-actions";

        const fullscreenBtn = document.createElement("button");
        fullscreenBtn.type = "button";
        fullscreenBtn.className = "result-canvas-btn";
        fullscreenBtn.textContent = "全屏展示";

        const exportImageBtn = document.createElement("button");
        exportImageBtn.type = "button";
        exportImageBtn.className = "result-canvas-btn";
        exportImageBtn.textContent = "导出图片";

        const exportPdfBtn = document.createElement("button");
        exportPdfBtn.type = "button";
        exportPdfBtn.className = "result-canvas-btn";
        exportPdfBtn.textContent = "导出 PDF";

        canvasActions.appendChild(fullscreenBtn);
        canvasActions.appendChild(exportImageBtn);
        canvasActions.appendChild(exportPdfBtn);

        canvasHeader.appendChild(canvasTitle);
        canvasHeader.appendChild(canvasActions);
        resultGrid.appendChild(canvasHeader);

        const canvasGrid = document.createElement("div");
        canvasGrid.className = "result-canvas-grid";
        (payload.result || []).forEach((item) => {
            const card = createResultCard(item.title, item.type);
            if (item.type === "list") {
                renderResultList(card, item);
            } else if (item.type === "bar") {
                renderBarChart(card, item);
            } else if (item.type === "pie") {
                renderPieChart(card, item);
            }
            canvasGrid.appendChild(card);
        });
        resultGrid.appendChild(canvasGrid);
        fullscreenBtn.addEventListener("click", () => toggleCanvasFullscreen(resultGrid, fullscreenBtn));
        exportImageBtn.addEventListener("click", () => exportCanvasAsImage(resultGrid));
        exportPdfBtn.addEventListener("click", () => exportCanvasAsPdf(resultGrid));
        resultSection.appendChild(resultGrid);
        container.appendChild(resultSection);

        const actions = document.createElement("div");
        actions.className = "ai-actions";
        [
            "复制",
            "点赞",
            "点踩",
            "反馈",
            "分支"
        ].forEach((label) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "ai-action-btn";
            button.textContent = label;
            actions.appendChild(button);
        });
        container.appendChild(actions);
    }

    function renderProgressDock(progressItems) {
        if (!progressItems || progressItems.length === 0) {
            progressDock.hidden = true;
            progressDockInner.innerHTML = "";
            return;
        }

        progressDockInner.innerHTML = "";

        const header = document.createElement("summary");
        header.className = "progress-dock-header";
        header.appendChild(createSectionTitle("AI 执行进度"));

        const toggle = document.createElement("span");
        toggle.className = "progress-dock-toggle";
        toggle.textContent = "⌃";
        header.appendChild(toggle);

        progressDockInner.appendChild(header);

        const body = document.createElement("div");
        body.className = "progress-dock-body";
        const progressList = document.createElement("div");
        progressList.className = "ai-progress";
        progressItems.forEach((item) => {
            const row = document.createElement("div");
            row.className = "ai-progress-item";

            const dot = document.createElement("span");
            dot.className = `ai-progress-dot ${item.status || ""}`;

            const rowContent = document.createElement("div");
            rowContent.className = "ai-progress-content";

            const label = document.createElement("div");
            label.className = "ai-progress-label";
            label.textContent = item.label || "";

            const desc = document.createElement("div");
            desc.className = "ai-progress-desc";
            desc.textContent = item.description || "";

            rowContent.appendChild(label);
            rowContent.appendChild(desc);
            row.appendChild(dot);
            row.appendChild(rowContent);
            progressList.appendChild(row);
        });

        body.appendChild(progressList);
        progressDockInner.appendChild(body);
        progressDockInner.open = true;
        progressDock.hidden = false;
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        appendMessage("user", text);
        syncEmptyState();

        messageInput.value = "";
        sendBtn.disabled = true;
        autoResizeTextarea();

        setTimeout(() => {
            const reply = buildMockReply(text);
            renderProgressDock(reply.progress || []);
            appendMessage("ai", reply);
        }, 500);
    }

    window.addEventListener("resize", () => {
        if (!isMobile()) {
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
        }
    });

    canvasBackdrop.addEventListener("click", () => {
        const activeCanvas = document.querySelector(".ai-result.is-fullscreen");
        if (!activeCanvas) return;
        activeCanvas.classList.remove("is-fullscreen");
        document.body.classList.remove("canvas-fullscreen");
        canvasBackdrop.classList.remove("show");
        const toggle = activeCanvas.querySelector(".result-canvas-btn");
        if (toggle) {
            toggle.textContent = "全屏展示";
        }
    });

    syncEmptyState();
</script>
</body>
</html>
