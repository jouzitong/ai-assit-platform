<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Web Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --sidebar-width: 288px;
            --sidebar-collapsed-width: 76px;

            --bg-main: #ffffff;
            --bg-sidebar: #f7f7f8;
            --bg-hover: #eeeeef;
            --bg-active: #e9e9eb;
            --bg-input: #ffffff;
            --bg-user: #f4f4f5;

            --text-main: #202123;
            --text-muted: #6b7280;
            --border: #e5e7eb;

            --primary: #10a37f;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body.dark {
            --bg-main: #212121;
            --bg-sidebar: #171717;
            --bg-hover: #2f2f2f;
            --bg-active: #343434;
            --bg-input: #2f2f2f;
            --bg-user: #303030;

            --text-main: #ececec;
            --text-muted: #a1a1aa;
            --border: #333333;

            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            color: var(--text-main);
            background: var(--bg-main);
        }

        button,
        textarea {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100vw;
            height: 100vh;
            display: flex;
            background: var(--bg-main);
        }

        /* =========================
           左侧栏
        ========================= */

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 12px;
            transition: width 0.22s ease, transform 0.22s ease;
            overflow: hidden;
            z-index: 30;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed-width);
            padding-left: 10px;
            padding-right: 10px;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            min-height: 42px;
        }

        .brand {
            flex: 1;
            height: 42px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 650;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-desc {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--bg-hover);
        }

        .collapse-btn {
            transition: transform 0.22s ease;
        }

        .sidebar.collapsed .collapse-btn {
            transform: rotate(180deg);
        }

        .new-chat {
            width: 100%;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .new-chat:hover {
            background: var(--bg-hover);
        }

        .btn-icon {
            width: 22px;
            flex-shrink: 0;
            text-align: center;
            font-size: 16px;
        }

        .btn-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .side-tools {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .side-tool {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            font-size: 14px;
            text-align: left;
        }

        .side-tool:hover {
            background: var(--bg-hover);
        }

        .side-tool.active {
            background: var(--bg-active);
        }

        .tool-icon {
            width: 22px;
            flex-shrink: 0;
            text-align: center;
            font-size: 16px;
        }

        .tool-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-title {
            font-size: 12px;
            color: var(--text-muted);
            padding: 8px 8px 6px;
            white-space: nowrap;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
        }

        .chat-item {
            width: 100%;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .chat-item:hover {
            background: var(--bg-hover);
        }

        .chat-item.active {
            background: var(--bg-active);
        }

        .chat-icon {
            width: 22px;
            flex-shrink: 0;
            text-align: center;
            font-size: 15px;
        }

        .chat-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #dbeafe;
            color: #1d4ed8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-plan {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 侧边栏最小化时 */
        .sidebar.collapsed .brand-text,
        .sidebar.collapsed .btn-text,
        .sidebar.collapsed .tool-text,
        .sidebar.collapsed .chat-title,
        .sidebar.collapsed .history-title,
        .sidebar.collapsed .user-info {
            display: none;
        }

        .sidebar.collapsed .sidebar-top {
            justify-content: center;
            flex-direction: column;
            height: auto;
        }

        .sidebar.collapsed .brand {
            justify-content: center;
            flex: none;
            width: 100%;
        }

        .sidebar.collapsed .new-chat,
        .sidebar.collapsed .side-tool,
        .sidebar.collapsed .chat-item {
            justify-content: center;
            padding: 0;
        }

        .sidebar.collapsed .sidebar-footer {
            justify-content: center;
        }

        /* =========================
           主聊天区域
        ========================= */

        .main {
            flex: 1;
            min-width: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .topbar {
            height: 58px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            background: var(--bg-main);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .menu-btn {
            display: none;
        }

        .model-title {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .model-name {
            font-size: 15px;
            font-weight: 650;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .model-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .small-btn {
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            padding: 0 12px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .small-btn:hover {
            background: var(--bg-hover);
        }

        .chat-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 32px 18px 28px;
        }

        .welcome {
            max-width: 780px;
            margin: 70px auto 28px;
            text-align: center;
        }

        .welcome h1 {
            font-size: 32px;
            line-height: 1.25;
            margin: 0 0 12px;
            font-weight: 700;
        }

        .welcome p {
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
        }

        .suggestions {
            max-width: 780px;
            margin: 24px auto 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .suggestion-card {
            min-height: 80px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: transparent;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            padding: 14px 16px;
        }

        .suggestion-card:hover {
            background: var(--bg-hover);
        }

        .suggestion-card strong {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .suggestion-card span {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .message-list {
            max-width: 860px;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 26px;
            line-height: 1.75;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 700;
            margin-top: 3px;
        }

        .message-avatar.ai {
            background: var(--primary);
            color: #fff;
        }

        .message-avatar.user {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .message-body {
            flex: 1;
            min-width: 0;
        }

        .message-name {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .message-text {
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user-message {
            justify-content: flex-end;
        }

        .message.user-message .message-avatar,
        .message.user-message .message-name {
            display: none;
        }

        .message.user-message .message-body {
            flex: none;
            max-width: 76%;
            background: var(--bg-user);
            border-radius: 18px;
            padding: 11px 15px;
        }

        /* =========================
           底部输入框
        ========================= */

        .composer-area {
            flex-shrink: 0;
            padding: 14px 18px 20px;
            background: var(--bg-main);
        }

        .composer {
            max-width: 860px;
            margin: 0 auto;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-input);
            box-shadow: var(--shadow);
            padding: 10px;
        }

        .composer textarea {
            width: 100%;
            min-height: 46px;
            max-height: 160px;
            resize: none;
            outline: none;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 15px;
            line-height: 1.6;
            padding: 8px 10px;
            display: block;
        }

        .composer-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 4px;
        }

        .composer-tools {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            cursor: pointer;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .hint {
            max-width: 860px;
            margin: 8px auto 0;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* =========================
           移动端
        ========================= */

        .overlay {
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: var(--sidebar-width);
                transform: translateX(-100%);
                box-shadow: var(--shadow);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar.collapsed {
                width: var(--sidebar-width);
                padding: 12px;
            }

            .sidebar.collapsed .brand-text,
            .sidebar.collapsed .btn-text,
            .sidebar.collapsed .tool-text,
            .sidebar.collapsed .chat-title,
            .sidebar.collapsed .history-title,
            .sidebar.collapsed .user-info {
                display: block;
            }

            .sidebar.collapsed .sidebar-top {
                flex-direction: row;
                justify-content: flex-start;
            }

            .sidebar.collapsed .brand {
                justify-content: flex-start;
                flex: 1;
            }

            .sidebar.collapsed .new-chat,
            .sidebar.collapsed .side-tool,
            .sidebar.collapsed .chat-item {
                justify-content: flex-start;
                padding: 0 10px;
            }

            .collapse-btn {
                display: none;
            }

            .menu-btn {
                display: inline-flex;
            }

            .overlay.show {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.35);
                z-index: 20;
            }

            .topbar {
                padding: 0 12px;
            }

            .topbar-actions .small-btn {
                display: none;
            }

            .chat-scroll {
                padding: 24px 14px 20px;
            }

            .welcome {
                margin-top: 40px;
            }

            .welcome h1 {
                font-size: 26px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .message.user-message .message-body {
                max-width: 88%;
            }

            .composer-area {
                padding: 12px 12px 16px;
            }

            .composer-tools .small-btn:nth-child(2) {
                display: none;
            }
        }
    </style>
</head>

<body>
<div class="app">
    <!-- 左侧栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand" title="AI Chat">
                <div class="brand-logo">AI</div>
                <div class="brand-text">
                    <div class="brand-name">AI Chat</div>
                    <div class="brand-desc">智能助手工作台</div>
                </div>
            </div>

            <button class="icon-btn collapse-btn" id="collapseBtn" title="最小化侧边栏">
                ⇤
            </button>
        </div>

        <button class="new-chat" id="newChatBtn" title="新建聊天">
            <span class="btn-icon">＋</span>
            <span class="btn-text">新建聊天</span>
        </button>

        <div class="side-tools">
            <button class="side-tool active" title="聊天">
                <span class="tool-icon">💬</span>
                <span class="tool-text">聊天</span>
            </button>

            <button class="side-tool" title="搜索">
                <span class="tool-icon">🔍</span>
                <span class="tool-text">搜索</span>
            </button>

            <button class="side-tool" title="项目">
                <span class="tool-icon">📁</span>
                <span class="tool-text">项目</span>
            </button>

            <button class="side-tool" title="收藏">
                <span class="tool-icon">⭐</span>
                <span class="tool-text">收藏</span>
            </button>
        </div>

        <div class="history-title">今天</div>

        <div class="chat-list">
            <div class="chat-item active" title="智能问数平台设计">
                <span class="chat-icon">📄</span>
                <span class="chat-title">智能问数平台设计</span>
            </div>

            <div class="chat-item" title="低代码 JSON 渲染方案">
                <span class="chat-icon">📄</span>
                <span class="chat-title">低代码 JSON 渲染方案</span>
            </div>

            <div class="chat-item" title="数据权限设计">
                <span class="chat-icon">📄</span>
                <span class="chat-title">数据权限设计</span>
            </div>

            <div class="chat-item" title="AI Agent 节点编排">
                <span class="chat-icon">📄</span>
                <span class="chat-title">AI Agent 节点编排</span>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="user-avatar">周</div>
            <div class="user-info">
                <div class="user-name">周志通</div>
                <div class="user-plan">个人工作区</div>
            </div>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- 主区域 -->
    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="icon-btn menu-btn" id="menuBtn" title="打开侧边栏">
                    ☰
                </button>

                <div class="model-title">
                    <div class="model-name">AI 助手</div>
                    <div class="model-subtitle">聊天页面完整示例</div>
                </div>
            </div>

            <div class="topbar-actions">
                <button class="small-btn" id="themeBtn">☾ 主题</button>
                <button class="small-btn">分享</button>
                <button class="small-btn">设置</button>
            </div>
        </header>

        <section class="chat-scroll" id="chatScroll">
            <div id="welcomeArea">
                <div class="welcome">
                    <h1>今天想聊点什么？</h1>
                    <p>这是一个仿 ChatGPT Web 风格的聊天页面。</p>
                </div>

                <div class="suggestions">
                    <button class="suggestion-card">
                        <strong>生成 SQL 查询方案</strong>
                        <span>根据自然语言拆解查询主体、条件和展示字段。</span>
                    </button>

                    <button class="suggestion-card">
                        <strong>设计低代码页面</strong>
                        <span>用 JSON 描述列表、详情、表单、看板页面。</span>
                    </button>

                    <button class="suggestion-card">
                        <strong>优化系统架构</strong>
                        <span>梳理服务拆分、节点流程、工具调用边界。</span>
                    </button>

                    <button class="suggestion-card">
                        <strong>写一个前端页面</strong>
                        <span>生成一个可以直接运行的 HTML 页面。</span>
                    </button>
                </div>
            </div>

            <div class="message-list" id="messageList"></div>
        </section>

        <footer class="composer-area">
            <div class="composer">
          <textarea
                  id="messageInput"
                  placeholder="给 AI 助手发送消息..."
                  rows="1"
          ></textarea>

                <div class="composer-bottom">
                    <div class="composer-tools">
                        <button class="small-btn">＋ 附件</button>
                        <button class="small-btn">工具</button>
                    </div>

                    <button class="send-btn" id="sendBtn" disabled title="发送">
                        ↑
                    </button>
                </div>
            </div>

            <div class="hint">Enter 发送，Shift + Enter 换行</div>
        </footer>
    </main>
</div>

<script>
    const sidebar = document.getElementById("sidebar");
    const collapseBtn = document.getElementById("collapseBtn");
    const menuBtn = document.getElementById("menuBtn");
    const overlay = document.getElementById("overlay");
    const themeBtn = document.getElementById("themeBtn");
    const newChatBtn = document.getElementById("newChatBtn");

    const chatScroll = document.getElementById("chatScroll");
    const welcomeArea = document.getElementById("welcomeArea");
    const messageList = document.getElementById("messageList");

    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    const mockReply = `这是一个模拟回复。

当前页面已经支持：

1. 侧边栏展开 / 最小化
2. 最小化后只显示图标
3. 主聊天区域自动适配宽度
4. 底部输入框固定在主区域底部
5. 明暗主题切换
6. 移动端抽屉侧边栏

后续你可以把这个模拟回复替换成真实接口调用。`;

    function isMobile() {
        return window.innerWidth <= 768;
    }

    function closeMobileSidebar() {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
    }

    collapseBtn.addEventListener("click", () => {
        if (isMobile()) return;

        sidebar.classList.toggle("collapsed");

        const collapsed = sidebar.classList.contains("collapsed");
        collapseBtn.title = collapsed ? "展开侧边栏" : "最小化侧边栏";
    });

    menuBtn.addEventListener("click", () => {
        sidebar.classList.add("open");
        overlay.classList.add("show");
    });

    overlay.addEventListener("click", closeMobileSidebar);

    themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");

        const isDark = document.body.classList.contains("dark");
        themeBtn.textContent = isDark ? "☀ 主题" : "☾ 主题";
    });

    newChatBtn.addEventListener("click", () => {
        messageList.innerHTML = "";
        welcomeArea.style.display = "block";
        messageInput.value = "";
        sendBtn.disabled = true;
        autoResizeTextarea();

        if (isMobile()) {
            closeMobileSidebar();
        }
    });

    document.querySelectorAll(".suggestion-card").forEach((card) => {
        card.addEventListener("click", () => {
            const title = card.querySelector("strong").innerText;
            messageInput.value = title;
            sendBtn.disabled = false;
            autoResizeTextarea();
            messageInput.focus();
        });
    });

    messageInput.addEventListener("input", () => {
        sendBtn.disabled = messageInput.value.trim() === "";
        autoResizeTextarea();
    });

    messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    sendBtn.addEventListener("click", sendMessage);

    function autoResizeTextarea() {
        messageInput.style.height = "auto";
        messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + "px";
    }

    function appendMessage(role, text) {
        const message = document.createElement("div");
        message.className = role === "user" ? "message user-message" : "message";

        const avatar = document.createElement("div");
        avatar.className =
            role === "user" ? "message-avatar user" : "message-avatar ai";
        avatar.textContent = role === "user" ? "你" : "AI";

        const body = document.createElement("div");
        body.className = "message-body";

        const name = document.createElement("div");
        name.className = "message-name";
        name.textContent = role === "user" ? "你" : "AI 助手";

        const content = document.createElement("div");
        content.className = "message-text";
        content.textContent = text;

        body.appendChild(name);
        body.appendChild(content);

        message.appendChild(avatar);
        message.appendChild(body);

        messageList.appendChild(message);

        chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        welcomeArea.style.display = "none";

        appendMessage("user", text);

        messageInput.value = "";
        sendBtn.disabled = true;
        autoResizeTextarea();

        setTimeout(() => {
            appendMessage("ai", mockReply);
        }, 500);
    }

    window.addEventListener("resize", () => {
        if (!isMobile()) {
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
        }
    });
</script>
</body>
</html>
