<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">智能问数 ZG 品牌标识</title>
  <desc id="desc">长方形品牌图，左侧为数据问答图标，右侧为智能问数文字，下方有分割线和 ZG。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="0.52" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF5FF"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(870 92) rotate(147) scale(600 260)">
      <stop stop-color="#EAF8FF"/>
      <stop offset="0.56" stop-color="#F8FCFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="blueCyan" x1="108" y1="396" x2="399" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1557E6"/>
      <stop offset="0.48" stop-color="#178AF2"/>
      <stop offset="1" stop-color="#21D6D5"/>
    </linearGradient>

    <linearGradient id="deepText" x1="500" y1="151" x2="1090" y2="222" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A5E"/>
      <stop offset="0.58" stop-color="#0A2F83"/>
      <stop offset="1" stop-color="#06164F"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="502" y1="284" x2="1110" y2="284" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1458EA"/>
      <stop offset="0.55" stop-color="#149CF2"/>
      <stop offset="1" stop-color="#20D8D2"/>
    </linearGradient>

    <linearGradient id="zgGrad" x1="690" y1="328" x2="900" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1168F2"/>
      <stop offset="0.6" stop-color="#17A9F5"/>
      <stop offset="1" stop-color="#20D5D3"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0B61E8" flood-opacity="0.14"/>
    </filter>

    <filter id="textShadow" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B1E5E" flood-opacity="0.10"/>
    </filter>

    <pattern id="dotPattern" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#8EC7FF" opacity="0.36"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#glow)"/>

  <!-- subtle digital waves -->
  <path d="M0 444C146 397 291 442 446 414C591 388 693 320 859 350C992 374 1070 453 1200 424V520H0V444Z" fill="#DDF0FF" opacity="0.42"/>
  <path d="M0 475C168 437 277 485 431 458C598 428 733 385 883 415C1019 442 1081 482 1200 460V520H0V475Z" fill="#CDE9FF" opacity="0.32"/>
  <path d="M57 443C207 424 321 471 471 444C619 418 729 381 877 404C1012 425 1079 468 1171 445" stroke="#AFD8FF" stroke-width="1.2" opacity="0.35"/>
  <rect x="700" y="42" width="440" height="160" fill="url(#dotPattern)" opacity="0.35" transform="rotate(-7 700 42)"/>
  <rect x="42" y="406" width="540" height="120" fill="url(#dotPattern)" opacity="0.33" transform="rotate(-6 42 406)"/>

  <!-- icon group -->
  <g filter="url(#softShadow)">
    <!-- orbit ring -->
    <circle cx="260" cy="260" r="178" stroke="url(#blueCyan)" stroke-width="14" fill="none" opacity="0.95"/>

    <circle cx="82" cy="260" r="18" fill="#1A63EB"/>
    <circle cx="424" cy="88" r="16" fill="#19CFE0"/>
    <circle cx="416" cy="385" r="16" fill="#168EF1"/>

    <g transform="translate(260 260) scale(0.82) translate(-286 -288)">
      <!-- speech bubble outline -->
      <path d="M172 157H399C429 157 452 180 452 210V311C452 341 429 364 399 364H270L172 425L184 364H172C142 364 119 341 119 311V210C119 180 142 157 172 157Z" fill="#FFFFFF"/>
      <path d="M172 157H399C429 157 452 180 452 210V311C452 341 429 364 399 364H270L172 425L184 364H172C142 364 119 341 119 311V210C119 180 142 157 172 157Z" stroke="url(#blueCyan)" stroke-width="28" stroke-linejoin="round"/>

      <!-- chart bars -->
      <rect x="210" y="288" width="46" height="62" rx="6" fill="url(#blueCyan)"/>
      <rect x="281" y="252" width="46" height="98" rx="6" fill="url(#blueCyan)"/>
      <rect x="352" y="205" width="46" height="145" rx="6" fill="url(#blueCyan)"/>

      <!-- chart line -->
      <path d="M207 262L270 207L312 219L383 151" stroke="url(#blueCyan)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="207" cy="262" r="14" fill="#1264EE"/>
      <circle cx="270" cy="207" r="14" fill="#158BF2"/>
      <circle cx="312" cy="219" r="14" fill="#159CF2"/>
      <circle cx="383" cy="151" r="17" fill="#20CEDB"/>
    </g>

    <!-- small sparkle / AI node -->
    <path d="M466 164L487 176L466 188L454 209L442 188L421 176L442 164L454 143L466 164Z" fill="#22D2D3" opacity="0.9"/>
  </g>

  <!-- text group -->
  <g filter="url(#textShadow)">
    <text x="508" y="228"
          font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Source Han Sans SC, Arial, sans-serif"
          font-size="112"
          font-weight="900"
          letter-spacing="4"
          fill="url(#deepText)">智能问数</text>
  </g>

  <!-- divider -->
  <rect x="510" y="283" width="600" height="7" rx="3.5" fill="url(#lineGrad)"/>
  <rect x="510" y="294" width="600" height="2" rx="1" fill="#D8F0FF" opacity="0.78"/>

  <!-- ZG row -->
  <g filter="url(#textShadow)">
    <rect x="595" y="356" width="74" height="7" rx="3.5" fill="url(#lineGrad)"/>
    <text x="724" y="400"
          font-family="Inter, Montserrat, Arial, sans-serif"
          font-size="92"
          font-weight="900"
          letter-spacing="5"
          fill="url(#zgGrad)">ZG</text>
    <rect x="982" y="356" width="74" height="7" rx="3.5" fill="url(#lineGrad)"/>
  </g>

  <!-- fine highlight line -->
  <path d="M506 278H1115" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85"/>
</svg>
