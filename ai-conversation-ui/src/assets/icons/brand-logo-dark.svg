<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">智能问数 ZG 深色主题品牌标识</title>
  <desc id="desc">适配深色主题的智能问数 ZG 品牌图，包含数据问答图标、名称和 ZG 标识。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172B4D"/>
      <stop offset="0.52" stop-color="#10213A"/>
      <stop offset="1" stop-color="#0A162A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 80) rotate(148) scale(620 270)">
      <stop stop-color="#1E78D7" stop-opacity="0.30"/>
