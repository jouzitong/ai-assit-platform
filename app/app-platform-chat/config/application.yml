spring:
  application:
    name: chat
  profiles:
    active: dev
    include: common, lib
  main:
    allow-bean-definition-overriding: true
server:
  port: 13103
  servlet:
    context-path: /chat

ai:
  tool:
    runtime:
      python-command: ${AI_TOOL_RUNTIME_PYTHON_COMMAND:python3}
      node-command: ${AI_TOOL_RUNTIME_NODE_COMMAND:node}
  chat:
    runtime:
      mode: ${AI_CHAT_RUNTIME_MODE:local}
      node-id: ${AI_CHAT_RUNTIME_NODE_ID:}
      active-ttl: 2h
      terminal-ttl: 30m
      max-replay-events: 512
      redis:
        key-prefix: ai:chat:runtime
  provider:
    ai-agent:
      enabled: ${AI_PROVIDER_AI_AGENT_ENABLED:true}
      response-language: ${AI_PROVIDER_AI_AGENT_RESPONSE_LANGUAGE:zh-CN}
      python-command: ${AI_PROVIDER_AI_AGENT_PYTHON_COMMAND:}
      script-path: ${AI_PROVIDER_AI_AGENT_SCRIPT_PATH:}
      working-directory: ${AI_PROVIDER_AI_AGENT_WORKING_DIRECTORY:}
      node-command: ${AI_PROVIDER_AI_AGENT_NODE_COMMAND:node}
      typescript-script-path: ${AI_PROVIDER_AI_AGENT_TYPESCRIPT_SCRIPT_PATH:}
      typescript-working-directory: ${AI_PROVIDER_AI_AGENT_TYPESCRIPT_WORKING_DIRECTORY:}
#      timeout-ms: ${AI_PROVIDER_AI_AGENT_TIMEOUT_MS:120000}
      chat-base-url: ${AI_PROVIDER_AI_AGENT_CHAT_BASE_URL:http://127.0.0.1:13103/chat}
    ragflow:
      enabled: ${AI_PROVIDER_RAGFLOW_ENABLED:false}
      base-url: ${AI_PROVIDER_RAGFLOW_BASE_URL:${RAGFLOW_BASE_URL:}}
      api-key: ${AI_PROVIDER_RAGFLOW_API_KEY:${RAGFLOW_API_KEY:}}
      timeout-ms: ${AI_PROVIDER_RAGFLOW_TIMEOUT_MS:30000}
    bailian-kb:
      workspace-id: ${AI_PROVIDER_BAILIAN_KB_WORKSPACE_ID:}

mybatis-plus:
  configuration:
    default-enum-type-handler: org.athena.framework.data.mybatis.handler.DefaultEnumTypeHandler

database:
  name: "ai_assist_chat_v3"
