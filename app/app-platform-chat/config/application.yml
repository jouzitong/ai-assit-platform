spring:
  application:
    name: chat
  profiles:
    active: dev
    include: common, lib
  main:
    allow-bean-definition-overriding: true
server:
  port: 13103
  servlet:
    context-path: /chat

ai:
  tool:
    runtime:
      python-command: ${AI_TOOL_RUNTIME_PYTHON_COMMAND:python3}
      node-command: ${AI_TOOL_RUNTIME_NODE_COMMAND:node}
  chat:
    runtime:
      mode: ${AI_CHAT_RUNTIME_MODE:local}
      node-id: ${AI_CHAT_RUNTIME_NODE_ID:}
      active-ttl: 2h
      terminal-ttl: 30m
      max-replay-events: 512
      redis:
        key-prefix: ai:chat:runtime
    memory:
      enabled: ${AI_CHAT_MEMORY_ENABLED:true}
      provider-type: RAGFLOW
      client-key: ${AI_CHAT_MEMORY_CLIENT_KEY:ragflow}
      # Required when Memory is enabled. It protects the stable tenant/user key sent to RAGFlow.
      identity-salt: ${AI_CHAT_MEMORY_IDENTITY_SALT:51af82d606d1215e86431888fc7f950702e18134cc374cc2dc9cb1324538b191}
      schema-version: ${AI_CHAT_MEMORY_SCHEMA_VERSION:1}
      session-enabled: ${AI_CHAT_MEMORY_SESSION_ENABLED:true}
      long-term-enabled: ${AI_CHAT_MEMORY_LONG_TERM_ENABLED:true}
      embedding-model: ${AI_CHAT_MEMORY_EMBEDDING_MODEL:text-embedding-v3}
      extraction-model: ${AI_CHAT_MEMORY_EXTRACTION_MODEL:qwen3.6-plus}
      memory-size: ${AI_CHAT_MEMORY_SIZE:5242880}
      forgetting-policy: FIFO
      recall:
        enabled: ${AI_CHAT_MEMORY_RECALL_ENABLED:true}
        # Keep shadow-only until deployed RAGFlow write idempotency has passed the Phase 0 contract gate.
        injection-enabled: ${AI_CHAT_MEMORY_RECALL_INJECTION_ENABLED:false}
        session-top-n: ${AI_CHAT_MEMORY_RECALL_SESSION_TOP_N:12}
        long-term-top-n: ${AI_CHAT_MEMORY_RECALL_LONG_TERM_TOP_N:6}
        similarity-threshold: ${AI_CHAT_MEMORY_RECALL_SIMILARITY_THRESHOLD:0.2}
        keyword-weight: ${AI_CHAT_MEMORY_RECALL_KEYWORD_WEIGHT:0.7}
        timeout-ms: ${AI_CHAT_MEMORY_RECALL_TIMEOUT_MS:800}
        token-budget: ${AI_CHAT_MEMORY_RECALL_TOKEN_BUDGET:3000}
        per-item-token-limit: ${AI_CHAT_MEMORY_RECALL_PER_ITEM_TOKEN_LIMIT:600}
      sync:
        shadow-write-enabled: ${AI_CHAT_MEMORY_SHADOW_WRITE_ENABLED:true}
        provider-idempotency-enabled: ${AI_CHAT_MEMORY_PROVIDER_IDEMPOTENCY_ENABLED:false}
        batch-size: ${AI_CHAT_MEMORY_SYNC_BATCH_SIZE:10}
        max-retries: ${AI_CHAT_MEMORY_SYNC_MAX_RETRIES:5}
        lease-timeout: ${AI_CHAT_MEMORY_SYNC_LEASE_TIMEOUT:2m}
        retry-base-delay: ${AI_CHAT_MEMORY_SYNC_RETRY_BASE_DELAY:10s}
        fixed-delay-ms: ${AI_CHAT_MEMORY_SYNC_FIXED_DELAY_MS:5000}
      provision:
        lease-timeout: ${AI_CHAT_MEMORY_PROVISION_LEASE_TIMEOUT:3m}
        verify-ttl: ${AI_CHAT_MEMORY_PROVISION_VERIFY_TTL:6h}
  provider:
    ai-agent:
      enabled: ${AI_PROVIDER_AI_AGENT_ENABLED:true}
      response-language: ${AI_PROVIDER_AI_AGENT_RESPONSE_LANGUAGE:zh-CN}
      python-command: ${AI_PROVIDER_AI_AGENT_PYTHON_COMMAND:}
      script-path: ${AI_PROVIDER_AI_AGENT_SCRIPT_PATH:}
      working-directory: ${AI_PROVIDER_AI_AGENT_WORKING_DIRECTORY:}
      node-command: ${AI_PROVIDER_AI_AGENT_NODE_COMMAND:node}
      typescript-script-path: ${AI_PROVIDER_AI_AGENT_TYPESCRIPT_SCRIPT_PATH:}
      typescript-working-directory: ${AI_PROVIDER_AI_AGENT_TYPESCRIPT_WORKING_DIRECTORY:}
#      timeout-ms: ${AI_PROVIDER_AI_AGENT_TIMEOUT_MS:120000}
      chat-base-url: ${AI_PROVIDER_AI_AGENT_CHAT_BASE_URL:http://127.0.0.1:13103/chat}
    ragflow:
      enabled: ${AI_PROVIDER_RAGFLOW_ENABLED:true}
      base-url: ${AI_PROVIDER_RAGFLOW_BASE_URL:${RAGFLOW_BASE_URL:http://43.142.108.229:18080}}
      api-key: ${AI_PROVIDER_RAGFLOW_API_KEY:${RAGFLOW_API_KEY:ragflow-bC7uuvWLU2P3ErUbj6OJ6CcNVizzLmSZw25avidPRn0}}
      timeout-ms: ${AI_PROVIDER_RAGFLOW_TIMEOUT_MS:30000}
    bailian-kb:
      workspace-id: ${AI_PROVIDER_BAILIAN_KB_WORKSPACE_ID:}

mybatis-plus:
  configuration:
    default-enum-type-handler: org.athena.framework.data.mybatis.handler.DefaultEnumTypeHandler

database:
  name: "ai_assist_chat_v3"
