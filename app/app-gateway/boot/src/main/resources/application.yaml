server:
  port: 9764
spring:
  application:
    name: ${app.gateway.name:gateway}
  main:
    allow-bean-definition-overriding: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  cloud:
    gateway:
      mvc:
        routes:
          - id: user-service-route
            uri: lb://user
            predicates:
              - Path=/user/**
            metadata:
              response-timeout: -1
          - id: ai-chat-service-route
            uri: lb://chat
            predicates:
              - Path=/chat/**
            metadata:
              response-timeout: -1
          - id: ai-engine-service-route
            uri: lb://aiEngine
            predicates:
              - Path=/aiEngine/**
            metadata:
              response-timeout: -1
          - id: db-engine-service-route
            uri: lb://dbEngine
            predicates:
              - Path=/dbEngine/**
            metadata:
              response-timeout: -1
          - id: file-service-route
            uri: lb://file
            predicates:
              - Path=/file/**
            metadata:
              response-timeout: -1
          - id: render-service-route
            uri: lb://render
            predicates:
              - Path=/render/**
            metadata:
              response-timeout: -1


gateway:
  request-guard:
    enabled: false
    header-name: X-Frontend-Environment
    # 为空时：生产 Profile 默认只允许 prod，其他已识别 Profile 默认允许自身值。
    expected-value: []
    ignore-urls:
      - /actuator/**
      - /health/**
      - /error
      - /favicon.ico
  security:
    enabled: true
    require-token: true
    header-name: Authorization
    token-prefix: Bearer
    signing:
      secret: ${GATEWAY_SECURITY_SIGNING_SECRET:}
    ignore-urls:
      - /actuator/**
      - /health/**
      - /user/auth/**
      - /error
      - /favicon.ico
    permission:
      enabled: false
      app-code: ${app.platform-user.name:app-platform-user}
      required-permissions-header: X-Gateway-Required-Permissions


athena:
  cloud:
    openfeign:
      logger-level: FULL
  security:
    enabled: true
    auth:
      enabled: true
      require-token: true
    token:
      type: jwt
      jwt:
        enabled: true
