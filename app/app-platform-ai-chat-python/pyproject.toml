[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-platform-ai-chat-python"
version = "0.1.0"
description = "OpenAI-compatible chat gateway for Open WebUI Phase A"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "pydantic>=2.11.7,<3.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
